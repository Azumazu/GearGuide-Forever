# Publishes GearGuide to CurseForge when a version tag (v1.2.3) is pushed.
# The item database is built locally (release.py needs the game client's scan) and committed;
# this workflow only packages the committed addon and uploads it.
# Repository settings needed: secret CF_API_TOKEN, variable CF_PROJECT_ID.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write  # attach the zip to a GitHub release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tag matches the TOC version
        run: |
          toc_version="$(python GearGuideTools/package.py --print-version)"
          if [ "v${toc_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match GearGuide.toc version ${toc_version}"; exit 1
          fi

      - name: Package
        run: python GearGuideTools/package.py

      - name: Upload to CurseForge
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_PROJECT_ID: ${{ vars.CF_PROJECT_ID }}
        run: python GearGuideTools/upload_curseforge.py

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: releases/GearGuide-*.zip
